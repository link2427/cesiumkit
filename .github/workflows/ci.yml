name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install "ruff==0.16.1" vulture
      - run: ruff check .
      - run: ruff format --check .
      - run: vulture cesiumkit --min-confidence 100

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[dev,gis]"
      - run: pytest --cov=cesiumkit --cov-fail-under=75

  # Deprecation gate: only cesiumkit's warning category is fatal. Dependency
  # warnings remain visible but cannot block a valid project release.
  deprecations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install ".[dev,gis]"
      - run: pytest -W error::cesiumkit._deprecations.CesiumkitDeprecationWarning

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install ".[dev,gis]"
      - run: pytest -q

  # Docstring drift guard: any broken ``` >>> ``` example in the package
  # fails this job. Needs every optional extra so all modules import.
  doctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install ".[dev,gis,raster,datashader,widget,testing]"
      - run: python -m playwright install chromium --with-deps
      - run: pytest --doctest-modules cesiumkit tests -q

  # Bundled-build tests (offline serving) need the ~120 MiB Cesium release,
  # so they run in their own job instead of every matrix entry.
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install ".[dev]"
      - run: python scripts/fetch_cesium.py
      - run: pytest tests/test_offline.py

  # Type-check the package with pyright. Installs every optional extra so
  # missing-import noise from optional deps doesn't mask real type errors.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install ".[dev,gis,raster,datashader,widget,testing]"
      - run: pyright cesiumkit

  # Build metadata/import sanity. The release workflow separately builds
  # with the vendored Cesium assets and browser-smokes that exact artifact.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build --wheel
      - run: |
          python - <<'EOF'
          import glob, venv, subprocess, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "cesiumkit/py.typed" in names, "py.typed missing from wheel"
          print("py.typed present in", wheel)
          venv.EnvBuilder(with_pip=True).create("/tmp/wheelvenv")
          subprocess.run(["/tmp/wheelvenv/bin/pip", "install", "-q", wheel], check=True)
          print("installed into fresh venv")
          EOF
      - run: /tmp/wheelvenv/bin/python -c "import cesiumkit; print('import OK', cesiumkit.__version__)"

  # Headless render check: prove the examples still initialize and render on
  # the bundled Cesium build, and upload the PNGs as build artifacts.
  render-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install ".[dev,gis,widget,raster,testing]"
      - run: python -m playwright install chromium --with-deps
      - run: python scripts/fetch_cesium.py
      - run: mkdir -p /tmp/cesiumkit-renders && python scripts/render_examples.py --output /tmp/cesiumkit-renders
      # The render tests need the bundled build + playwright + optional
      # extras, so they only make sense in this job.
      - run: pytest tests/test_widget.py tests/test_render_coverage.py tests/test_clipping.py tests/test_html_output.py tests/test_raster.py -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: example-renders
          path: /tmp/cesiumkit-renders
