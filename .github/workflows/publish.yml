name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  # Dry-run: publish the same artifacts to TestPyPI, install them back from
  # TestPyPI, and smoke-test. Mirrors the real publish exactly.
  test-pypi:
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python scripts/fetch_cesium.py
      - run: python -m build
      - run: twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Install from TestPyPI and smoke-test
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python3 -m venv /tmp/tp-venv
          /tmp/tp-venv/bin/pip install --quiet \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "cesiumkit==${VERSION}"
          /tmp/tp-venv/bin/python -c "import cesiumkit; import cesiumkit._vendor as v; assert v.vendor_dir() is not None, 'vendored Cesium missing from TestPyPI wheel'; print('TestPyPI install OK:', cesiumkit.__version__)"

  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python scripts/fetch_cesium.py
      - run: python -m build
      - run: twine check dist/*
      - name: Smoke-test the sdist in a fresh venv
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install --quiet dist/*.tar.gz
          /tmp/sdist-venv/bin/python -c "import cesiumkit; import cesiumkit._vendor as v; assert v.vendor_dir() is not None, 'vendored Cesium missing from sdist'; print('sdist OK:', cesiumkit.__version__)"
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Verify PEP 740 attestations on PyPI
        run: |
          pip install pypi-attestations
          for f in dist/cesiumkit-*.whl dist/cesiumkit-*.tar.gz; do
            ok=0
            for i in $(seq 1 12); do
              if python -m pypi_attestations verify pypi "$f" \
                  --repository https://github.com/link2427/cesiumkit; then
                ok=1
                break
              fi
              echo "attestation not visible yet, retrying ($i/12)..."
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "FAILED to verify attestation for $f"
              exit 1
            fi
          done
          echo "all PEP 740 attestations verified"
