name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag to publish (for example, v1.0.0)
        required: true
        type: string
      artifact_run_id:
        description: Completed release workflow run to recover exact build artifacts from
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and smoke-test release artifacts
    runs-on: ubuntu-latest
    outputs:
      release_commit: ${{ steps.release_identity.outputs.release_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify immutable release identity
        id: release_identity
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be exactly vX.Y.Z, got: $tag" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$tag"
          if [[ "$(git cat-file -t "refs/tags/$tag")" != "tag" ]]; then
            echo "Release tag must be annotated: $tag" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/$tag^{commit}")"
          test "$(git rev-parse HEAD)" = "$tag_commit"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag must point to a commit reachable from main: $tag" >&2
            exit 1
          fi
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          runtime_version="$(python - <<'PY'
          import ast
          from pathlib import Path

          module = ast.parse(Path("cesiumkit/_version.py").read_text(encoding="utf-8"))
          for statement in module.body:
              if isinstance(statement, ast.Assign) and any(
                  isinstance(target, ast.Name) and target.id == "__version__" for target in statement.targets
              ):
                  print(ast.literal_eval(statement.value))
                  break
          else:
              raise SystemExit("cesiumkit/_version.py does not assign __version__")
          PY
          )"
          test "$tag" = "v$version"
          test "$version" = "$runtime_version"
          echo "release_commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "Verified $tag at immutable commit $tag_commit for cesiumkit $version"
      - name: Validate recovery source
        if: github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != ''
        id: recovery_source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release_identity.outputs.release_commit }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          repository = os.environ["REPOSITORY"]
          repository_id = int(os.environ["REPOSITORY_ID"])
          source_run_id = os.environ["SOURCE_RUN_ID"]
          if not source_run_id.isascii() or not source_run_id.isdecimal() or int(source_run_id) < 1:
              raise SystemExit("artifact_run_id must be a positive decimal workflow run ID")
          source_run_id = str(int(source_run_id))

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{path}", headers=headers
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          run = get(f"actions/runs/{source_run_id}")
          expected_run = {
              "id": int(source_run_id),
              "event": "release",
              "path": ".github/workflows/publish.yml",
              "head_branch": os.environ["RELEASE_TAG"],
              "head_sha": os.environ["RELEASE_COMMIT"],
              "status": "completed",
          }
          for field, expected in expected_run.items():
              if run.get(field) != expected:
                  raise SystemExit(
                      f"Recovery run {field} mismatch: expected {expected!r}, got {run.get(field)!r}"
                  )
          if run.get("repository", {}).get("id") != repository_id:
              raise SystemExit("Recovery run belongs to a different repository")
          if run.get("head_repository", {}).get("id") != repository_id:
              raise SystemExit("Recovery run head belongs to a different repository")

          jobs = get(f"actions/runs/{source_run_id}/jobs?filter=all&per_page=100")["jobs"]
          successful_builds = [
              job
              for job in jobs
              if job.get("name") == "Build and smoke-test release artifacts"
              and job.get("conclusion") == "success"
          ]
          if not successful_builds:
              raise SystemExit("Recovery run has no successful release build job")

          artifact_payload = get(f"actions/runs/{source_run_id}/artifacts?per_page=100")
          artifacts = artifact_payload["artifacts"]
          if artifact_payload.get("total_count") != 1 or len(artifacts) != 1:
              raise SystemExit("Recovery run must contain exactly one artifact")
          artifact = artifacts[0]
          artifact_run = artifact.get("workflow_run", {})
          if artifact.get("name") != "release-artifacts" or artifact.get("expired"):
              raise SystemExit("Recovery run does not have an unexpired release-artifacts artifact")
          if not isinstance(artifact.get("id"), int) or artifact["id"] < 1:
              raise SystemExit("Recovery artifact does not have a valid artifact ID")
          if artifact.get("size_in_bytes", 0) < 1:
              raise SystemExit("Recovery artifact is empty")
          if artifact_run.get("id") != int(source_run_id):
              raise SystemExit("Recovery artifact references a different workflow run")
          if artifact_run.get("repository_id") != repository_id:
              raise SystemExit("Recovery artifact belongs to a different repository")
          if artifact_run.get("head_repository_id") != repository_id:
              raise SystemExit("Recovery artifact head belongs to a different repository")
          if artifact_run.get("head_sha") != os.environ["RELEASE_COMMIT"]:
              raise SystemExit("Recovery artifact was built from a different commit")
          digest = artifact.get("digest", "")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("Recovery artifact does not have a valid archive digest")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"artifact_id={artifact['id']}", file=output)
              print(f"artifact_digest={digest}", file=output)
              print(f"source_run_id={source_run_id}", file=output)
          print(
              f"Validated release artifact {artifact['id']} from workflow run {source_run_id} ({digest})"
          )
          PY
      - name: Download recovery artifact
        if: github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.recovery_source.outputs.artifact_id }}
          path: dist
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.recovery_source.outputs.source_run_id }}
      - name: Install release build tools
        if: github.event_name != 'workflow_dispatch' || inputs.artifact_run_id == ''
        run: pip install build twine
      - name: Vendor the checksum-verified Cesium release
        if: github.event_name != 'workflow_dispatch' || inputs.artifact_run_id == ''
        run: python scripts/fetch_cesium.py
      - name: Build release artifacts exactly once
        if: github.event_name != 'workflow_dispatch' || inputs.artifact_run_id == ''
        run: |
          python -m build
          twine check dist/*
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - name: Verify release artifact set and checksums
        run: |
          python - <<'PY'
          import hashlib
          import re
          import tomllib
          from pathlib import Path

          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          root = Path("dist")
          expected_files = {
              "SHA256SUMS",
              f"cesiumkit-{version}-py3-none-any.whl",
              f"cesiumkit-{version}.tar.gz",
          }
          entries = {path.relative_to(root).as_posix() for path in root.rglob("*")}
          if entries != expected_files:
              raise SystemExit(
                  f"Release artifact set mismatch: expected {sorted(expected_files)}, got {sorted(entries)}"
              )
          if any(not path.is_file() or path.is_symlink() for path in root.iterdir()):
              raise SystemExit("Release artifact directory contains a non-regular file")

          expected_payloads = expected_files - {"SHA256SUMS"}
          checksums = {}
          for line in (root / "SHA256SUMS").read_text(encoding="utf-8").splitlines():
              match = re.fullmatch(r"([0-9a-f]{64}) ([ *])([^/\\]+)", line)
              if not match:
                  raise SystemExit(f"Invalid SHA256SUMS line: {line!r}")
              digest, filename = match.group(1), match.group(3)
              if filename in checksums:
                  raise SystemExit(f"Duplicate SHA256SUMS entry: {filename}")
              checksums[filename] = digest
          if set(checksums) != expected_payloads:
              raise SystemExit("SHA256SUMS does not name the exact release payloads")
          for filename, expected in checksums.items():
              with (root / filename).open("rb") as file:
                  actual = hashlib.file_digest(file, "sha256").hexdigest()
              if actual != expected:
                  raise SystemExit(f"Checksum mismatch for {filename}")
          print("release artifact set and checksums verified")
          PY
      - name: Inspect wheel contents
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "cesiumkit/py.typed" in names, "py.typed missing from wheel"
          assert any(name.endswith("vendor/cesium/Cesium.js") for name in names), "vendored Cesium missing from wheel"
          print("wheel contains py.typed and vendored Cesium:", wheel)
          PY
      - name: Smoke-test the built wheel in a clean browser environment
        run: |
          python -m venv /tmp/cesiumkit-wheel-smoke
          /tmp/cesiumkit-wheel-smoke/bin/pip install --quiet --upgrade pip
          wheel=$(echo dist/*.whl)
          /tmp/cesiumkit-wheel-smoke/bin/pip install --quiet "$wheel[testing]"
          /tmp/cesiumkit-wheel-smoke/bin/python -m playwright install chromium --with-deps
          cp scripts/smoke_render.py /tmp/cesiumkit-wheel-smoke.py
          cd /tmp
          /tmp/cesiumkit-wheel-smoke/bin/python cesiumkit-wheel-smoke.py --screenshot /tmp/cesiumkit-wheel-smoke.png
          test -s /tmp/cesiumkit-wheel-smoke.png
      - name: Smoke-test the built sdist in a fresh environment
        run: |
          python -m venv /tmp/cesiumkit-sdist-smoke
          /tmp/cesiumkit-sdist-smoke/bin/pip install --quiet --upgrade pip
          /tmp/cesiumkit-sdist-smoke/bin/pip install --quiet dist/*.tar.gz
          cd /tmp
          /tmp/cesiumkit-sdist-smoke/bin/python -c "import cesiumkit; import cesiumkit._vendor as v; assert v.vendor_dir() is not None; print('sdist install OK:', cesiumkit.__version__)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: dist
          if-no-files-found: error
          retention-days: 14

  test-pypi:
    name: Stage and test the built artifacts on TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.release_commit }}
          persist-credentials: false
      - name: Verify release checkout
        env:
          RELEASE_COMMIT: ${{ needs.build.outputs.release_commit }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist
      - name: Verify staged artifact checksums
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          rm dist/SHA256SUMS
      - name: Check TestPyPI release state
        id: testpypi_preflight
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import time
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          staged = {}
          for path in Path("dist").iterdir():
              with path.open("rb") as file:
                  staged[path.name] = hashlib.file_digest(file, "sha256").hexdigest()

          url = f"https://test.pypi.org/pypi/cesiumkit/{version}/json"
          payload = None
          release_absent = False
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      payload = json.load(response)
                  break
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      release_absent = True
                      break
                  failure = error
              except (OSError, json.JSONDecodeError) as error:
                  failure = error
              if attempt == 5:
                  raise SystemExit(f"Could not query TestPyPI release state: {failure}")
              time.sleep(5)

          if release_absent:
              published = {}
          else:
              if payload is None:
                  raise SystemExit("TestPyPI returned no release metadata; refusing to upload")
              published = {entry["filename"]: entry["digests"]["sha256"] for entry in payload["urls"]}
          unexpected = set(published) - set(staged)
          mismatches = {
              name for name in set(staged) & set(published) if published[name] != staged[name]
          }
          if unexpected or mismatches:
              raise SystemExit(
                  "TestPyPI release conflicts with the staged files; refusing to upload: "
                  f"unexpected={sorted(unexpected)}, mismatched={sorted(mismatches)}"
              )

          missing = set(staged) - set(published)
          publish = bool(missing)
          if publish:
              upload_dir = Path("upload-dist")
              upload_dir.mkdir()
              for filename in sorted(missing):
                  shutil.copy2(Path("dist") / filename, upload_dir / filename)
              print(f"TestPyPI upload is limited to missing files: {sorted(missing)}")
          else:
              print("TestPyPI already has the exact staged files; upload is unnecessary")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"publish={str(publish).lower()}", file=output)
          PY
      - name: Publish artifacts to TestPyPI
        if: steps.testpypi_preflight.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: upload-dist/
      - name: Verify TestPyPI has the exact staged files
        run: |
          python - <<'PY'
          import glob
          import hashlib
          import json
          import time
          import tomllib
          import urllib.request
          from pathlib import Path

          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          staged = {}
          for filename in glob.glob("dist/*"):
              path = Path(filename)
              with path.open("rb") as file:
                  staged[path.name] = hashlib.file_digest(file, "sha256").hexdigest()
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(
                      f"https://test.pypi.org/pypi/cesiumkit/{version}/json", timeout=15
                  ) as response:
                      payload = json.load(response)
                  published = {entry["filename"]: entry["digests"]["sha256"] for entry in payload["urls"]}
              except (OSError, json.JSONDecodeError):
                  published = {}
              missing = set(staged) - set(published)
              unexpected = set(published) - set(staged)
              mismatches = {
                  name: digest for name, digest in staged.items() if name in published and published[name] != digest
              }
              if mismatches:
                  raise SystemExit(f"TestPyPI digest mismatch: {mismatches}")
              if unexpected:
                  raise SystemExit(f"TestPyPI has unexpected files for this version: {sorted(unexpected)}")
              if not missing:
                  print("TestPyPI files match the staged release artifacts")
                  break
              if attempt == 11:
                  raise SystemExit(f"TestPyPI did not expose staged files in time: {sorted(missing)}")
              time.sleep(10)
          PY
      - name: Install TestPyPI wheel and browser-smoke it
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          python -m venv /tmp/cesiumkit-testpypi-smoke
          /tmp/cesiumkit-testpypi-smoke/bin/pip install --quiet --upgrade pip
          mkdir -p /tmp/cesiumkit-testpypi-wheel
          /tmp/cesiumkit-testpypi-smoke/bin/pip download --quiet --no-deps --only-binary=:all: \
            --index-url https://test.pypi.org/simple/ \
            --dest /tmp/cesiumkit-testpypi-wheel \
            "cesiumkit==${VERSION}"
          wheel=$(echo /tmp/cesiumkit-testpypi-wheel/*.whl)
          test -f "$wheel"
          test "$(sha256sum "$wheel" | cut -d' ' -f1)" = "$(sha256sum dist/*.whl | cut -d' ' -f1)"
          /tmp/cesiumkit-testpypi-smoke/bin/pip install --quiet \
            --index-url https://pypi.org/simple/ \
            "$wheel[testing]"
          /tmp/cesiumkit-testpypi-smoke/bin/python -m playwright install chromium --with-deps
          cp scripts/smoke_render.py /tmp/cesiumkit-testpypi-smoke.py
          cd /tmp
          /tmp/cesiumkit-testpypi-smoke/bin/python cesiumkit-testpypi-smoke.py --screenshot /tmp/cesiumkit-testpypi-smoke.png
          test -s /tmp/cesiumkit-testpypi-smoke.png

  publish:
    name: Promote the staged artifacts to PyPI
    needs: [build, test-pypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.release_commit }}
          persist-credentials: false
      - name: Verify release checkout
        env:
          RELEASE_COMMIT: ${{ needs.build.outputs.release_commit }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist
      - name: Verify staged artifact checksums
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          rm dist/SHA256SUMS
      - name: Check PyPI release state
        id: pypi_preflight
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import time
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          staged = {}
          for path in Path("dist").iterdir():
              with path.open("rb") as file:
                  staged[path.name] = hashlib.file_digest(file, "sha256").hexdigest()

          url = f"https://pypi.org/pypi/cesiumkit/{version}/json"
          payload = None
          release_absent = False
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      payload = json.load(response)
                  break
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      release_absent = True
                      break
                  failure = error
              except (OSError, json.JSONDecodeError) as error:
                  failure = error
              if attempt == 5:
                  raise SystemExit(f"Could not query PyPI release state: {failure}")
              time.sleep(5)

          if release_absent:
              published = {}
          else:
              if payload is None:
                  raise SystemExit("PyPI returned no release metadata; refusing to upload")
              published = {entry["filename"]: entry["digests"]["sha256"] for entry in payload["urls"]}
          unexpected = set(published) - set(staged)
          mismatches = {
              name for name in set(staged) & set(published) if published[name] != staged[name]
          }
          if unexpected or mismatches:
              raise SystemExit(
                  "PyPI release conflicts with the staged files; refusing to upload: "
                  f"unexpected={sorted(unexpected)}, mismatched={sorted(mismatches)}"
              )

          missing = set(staged) - set(published)
          existing = set(staged) & set(published)
          publish = bool(missing)
          if publish:
              upload_dir = Path("upload-dist")
              upload_dir.mkdir()
              for filename in sorted(missing):
                  shutil.copy2(Path("dist") / filename, upload_dir / filename)
              if existing:
                  existing_dir = Path("existing-dist")
                  existing_dir.mkdir()
                  for filename in sorted(existing):
                      shutil.copy2(Path("dist") / filename, existing_dir / filename)
              print(f"PyPI upload is limited to missing files: {sorted(missing)}")
          else:
              print("PyPI already has the exact staged files; upload is unnecessary")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"publish={str(publish).lower()}", file=output)
              print(f"verify_existing={str(bool(publish and existing)).lower()}", file=output)
          PY
      - name: Verify existing PyPI attestations before partial upload
        if: steps.pypi_preflight.outputs.verify_existing == 'true'
        run: |
          pip install pypi-attestations
          for f in existing-dist/*; do
            ok=0
            for i in $(seq 1 12); do
              if python -m pypi_attestations verify pypi "$f" \
                  --repository https://github.com/link2427/cesiumkit; then
                ok=1
                break
              fi
              echo "attestation not visible yet, retrying ($i/12)..."
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "FAILED to verify existing attestation for $f"
              exit 1
            fi
          done
      - name: Publish artifacts to PyPI
        if: steps.pypi_preflight.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: upload-dist/
      - name: Verify PyPI has the exact staged files
        run: |
          python - <<'PY'
          import glob
          import hashlib
          import json
          import time
          import tomllib
          import urllib.request
          from pathlib import Path

          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          staged = {}
          for filename in glob.glob("dist/*"):
              path = Path(filename)
              with path.open("rb") as file:
                  staged[path.name] = hashlib.file_digest(file, "sha256").hexdigest()
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(
                      f"https://pypi.org/pypi/cesiumkit/{version}/json", timeout=15
                  ) as response:
                      payload = json.load(response)
                  published = {entry["filename"]: entry["digests"]["sha256"] for entry in payload["urls"]}
                  if set(published) - set(staged):
                      raise SystemExit(
                          f"PyPI has unexpected files for this version: {sorted(set(published) - set(staged))}"
                      )
                  mismatches = {
                      name: digest
                      for name, digest in staged.items()
                      if name in published and published[name] != digest
                  }
                  if mismatches:
                      raise SystemExit(f"PyPI digest mismatch: {mismatches}")
                  if set(published) == set(staged) and all(
                      published.get(name) == digest for name, digest in staged.items()
                  ):
                      print("PyPI files match the staged release artifacts")
                      break
              except (OSError, json.JSONDecodeError):
                  pass
              if attempt == 11:
                  raise SystemExit("PyPI did not expose the staged artifact digests in time")
              time.sleep(10)
          PY
      - name: Verify PEP 740 attestations on PyPI
        run: |
          pip install pypi-attestations
          for f in dist/cesiumkit-*.whl dist/cesiumkit-*.tar.gz; do
            ok=0
            for i in $(seq 1 12); do
              if python -m pypi_attestations verify pypi "$f" \
                  --repository https://github.com/link2427/cesiumkit; then
                ok=1
                break
              fi
              echo "attestation not visible yet, retrying ($i/12)..."
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "FAILED to verify attestation for $f"
              exit 1
            fi
          done
          echo "all PEP 740 attestations verified"
