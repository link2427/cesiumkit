site_name: cesiumkit
site_url: https://link2427.github.io/cesiumkit
site_description: Build CesiumJS 3D globe visualizations entirely in Python.
repo_url: https://github.com/link2427/cesiumkit
repo_name: link2427/cesiumkit

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: octicons/tag-16
      tip: octicons/light-bulb-16
      example: octicons/beaker-16
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.footer
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: google
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            annotations_path: brief
            modernize_annotations: true
            line_length: 80
            summary: true
            docstring_options:
              ignore_init_summary: true
              trim_doctest_flags: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds: {case: lower}
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Tutorial: tutorial.md
  - Guide:
      - guide/index.md
      - How to plot a GeoDataFrame: getting-started-gis.md
      - How to control a live viewer: runtime-control.md
      - How to use the Jupyter widget: widget.md
      - How to display rasters and large point data: raster.md
      - How to clip and classify 3D Tiles: guide/clipping.md
  - Examples:
      - examples/index.md
      - examples/01_basic_point.md
      - examples/02_shapes_and_materials.md
      - examples/03_multiple_cities.md
      - examples/04_time_dynamic_satellite.md
      - examples/05_geojson_and_datasources.md
      - examples/06_terrain_and_imagery.md
      - examples/07_3d_models_and_tilesets.md
      - examples/08_czml_export.md
      - examples/09_camera_controls.md
      - examples/10_event_handlers.md
      - examples/11_runtime_control.md
  - Gallery: gallery.md
  - Reference:
      - reference/index.md
      - Troubleshooting: troubleshooting.md
      - Architecture: architecture.md
      - Migration Guide: migration.md
  - API Reference:
      - api/index.md
      - Viewer: api/viewer.md
      - Entity: api/entities.md
      - Coordinates & Math: api/coordinates.md
      - Math: api/math.md
      - Color: api/color.md
      - Materials: api/materials.md
      - Particle Systems: api/particle.md
      - Camera: api/camera.md
      - Clustering: api/clustering.md
      - Properties: api/properties.md
      - Data Sources: api/datasources.md
      - Imagery Providers: api/imagery.md
      - Terrain Providers: api/terrain.md
      - Scene & Globe: api/scene.md
      - Enums: api/enums.md
      - Ion: api/ion.md
      - CZML Export: api/czml.md
      - Clock & Time: api/clock.md
      - Events: api/events.md
      - GIS Integration: api/gis.md
      - Utilities: api/utils.md
      - Headless Testing: api/testing.md
