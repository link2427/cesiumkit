[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cesiumkit"
version = "0.7.0"
description = "Object-oriented Python interface for CesiumJS 3D geospatial visualization"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICEN[CS]E*", "AUTHORS*"]
authors = [
    { name = "Jacob Neel" },
]
keywords = [
    "cesium",
    "cesiumjs",
    "geospatial",
    "3d",
    "visualization",
    "globe",
    "maps",
    "gis",
    "czml",
    "gltf",
    "tiles",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "pydantic>=2.0",
    "jinja2>=3.0",
]

[project.optional-dependencies]
dev = [
    "pillow>=10",
    "pytest>=7.0",
    "pytest-cov",
    "pyright>=1.1.390",
    "ruff==0.16.1",
    "vulture>=2.7",
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
]
gis = [
    "geopandas>=0.14",
    "shapely>=2.0",
]
raster = [
    "rio-tiler>=4.0",
    "rasterio>=1.3",
    "xarray>=2023.1",
]
datashader = [
    "datashader>=0.16",
]
images = ["pillow>=10"]
widget = [
    "anywidget>=0.9",
    "ipywidgets>=8.0",
    "traitlets>=5.9",
]

[project.urls]
Homepage = "https://github.com/link2427/cesiumkit"
Documentation = "https://link2427.github.io/cesiumkit"
Repository = "https://github.com/link2427/cesiumkit"
Issues = "https://github.com/link2427/cesiumkit/issues"

# The vendored Cesium build (cesiumkit/vendor/) is fetched by
# scripts/fetch_cesium.py; the publish workflow runs it before building so
# the wheel ships with offline support. When absent, cesiumkit falls back
# to the CDN.
[tool.hatch.build.targets.wheel]
packages = ["cesiumkit"]
exclude = ["cesiumkit/vendor/.gitkeep"]
force-include = { "cesiumkit/vendor" = "cesiumkit/vendor" }

[tool.hatch.build.targets.sdist]
exclude = ["cesiumkit/vendor/.gitkeep"]
force-include = { "cesiumkit/vendor" = "cesiumkit/vendor" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]

[tool.pyright]
include = ["cesiumkit"]
exclude = ["cesiumkit/vendor"]
typeCheckingMode = "standard"
pythonVersion = "3.10"
reportMissingImports = true
